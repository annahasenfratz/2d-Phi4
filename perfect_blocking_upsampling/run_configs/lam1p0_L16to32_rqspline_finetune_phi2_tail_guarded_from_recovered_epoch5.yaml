lambda: 1.0
kappa_f: 0.340301
kappa_c: 0.340301
eta_convention: "eta is included in the selected blocking kernel; do not multiply by eta separately"
L_c: 16
L_f: 32
block_factor: 2

mode: matched_pair_rqspline_finetune_phi2_tail_guarded_branch
description: >
  Short controlled branch from the exactly recovered eligible epoch-5 state.
  This branch protects the full phi2 distribution and upper tail while keeping
  the architecture and matched native L32-to-blocked-L16 data fixed.

source_checkpoint: perfect_blocking_upsampling/runs/lam1p0/training/recovery_epoch5_from_20260717T205352Z_20260717T235000Z/checkpoints/checkpoint_epoch005.pt
excluded_source_checkpoints:
  - stale epoch-11 checkpoint from the interrupted 20260717T205352Z run
  - phi4-guarded branch checkpoint
  - original zero-shot L8to16 checkpoint
fine_config_source: data/configs_phi4_2d/lam1p0_kappac0p340301_L32/configs.npz
kernel_path: perfect_blocking/perfect_blocking_lam1p0/kernels/selected_for_upscaling/best_7x7_phi2_nn_guarded_eta_included.json
kernel_coefficients_include_eta_scale: true

architecture:
  factorization: "q(d01|coarse) q(d10|coarse,d01) q(d11|coarse,d01,d10)"
  layers_per_stage: 8
  hidden_channels: 48
  conv_kernel_size: 3
  spline:
    num_bins: 8
    tail_bound: 6.0
    min_bin_width: 0.001
    min_bin_height: 0.001
    min_derivative: 0.001
    tails: linear

training:
  learning_rate: 5.0e-5
  batch_size: 128
  epochs_initial: 5
  eval_every: 1
  stop_after_eval_epoch: 5
  train_count: 4000
  val_count: 500
  test_count: 500
  random_seed: 2026071721
  grad_clip: 10.0
  weight_decay: 1.0e-5

observable_weights:
  action_density: 0.08
  phi2: 0.08
  phi4: 0.08
  local_kurtosis_ratio: 0.10
  NN: 0.05
  2nn: 0.01
  diag: 0.01
  G_pmin_avg: 0.002

phi2_tail_guard:
  enabled: true
  support_weight_source: observable_weights.phi2
  terms:
    - mean
    - standard_deviation
    - upper_q90_undercoverage
    - upper_q95_undercoverage
    - upper_q99_undercoverage
    - smooth_tail_occupancy_above_native_q90
    - smooth_tail_occupancy_above_native_q95
    - smooth_tail_occupancy_above_native_q99
  best_patch_requirements:
    abs_phi2_mean_shift_lt: 0.20
    phi2_ks_lt: 0.10
    q90_ratio_range: [0.97, 1.03]
    q95_ratio_range: [0.95, 1.05]
    q99_ratio_range: [0.90, 1.10]
    frac_above_native_q95_ge: 0.04
    frac_above_native_q99_ge: 0.005

diagnostics:
  intermediate:
    global_chains: 32
    global_sweeps: 50
    local_chains: 32
    local_sweeps: 25
  branch_epoch5_full_comparison:
    global_chains: 64
    global_sweeps: 100
    local_chains: 64
    local_sweeps: 25
  local_detail_patch_size: 16
  local_detail_passes: 10
  local_fine_proposal_sigma: 0.04

proposed_command: >
  ../.venv/bin/python -B perfect_blocking_upsampling/scripts/train_lam1p0_l16to32_rqspline_finetune.py
  --run-dir perfect_blocking_upsampling/runs/lam1p0/training/lam1p0_L16to32_kf0p340301_kc0p340301_7x7_rqspline_phi2_tail_guarded_branch_from_recovered_ep5_<timestamp>
  --source-checkpoint perfect_blocking_upsampling/runs/lam1p0/training/recovery_epoch5_from_20260717T205352Z_20260717T235000Z/checkpoints/checkpoint_epoch005.pt
  --epochs 5
  --eval-every 1
  --stop-after-eval-epoch 5
  --global-chains 32
  --global-sweeps 50
  --local-chains 32
  --local-sweeps 25
  --phi2-tail-guard
  --obs-weights action_density=0.08,phi2=0.08,phi4=0.08,local_kurtosis_ratio=0.10,NN=0.05,2nn=0.01,diag=0.01,G_pmin_avg=0.002
